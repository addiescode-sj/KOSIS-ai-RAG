services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Inside compose the backend reaches the vector store (PostgreSQL + pgvector, T2-44) by service name; .env holds
      # the host-side address. For a shared database, set COMPOSE_DATABASE_URL in .env (compose reads it for ${...}).
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-kosis}:${POSTGRES_PASSWORD:-kosis}@postgres:5432/${POSTGRES_DB:-kosis}}
      # .env value unless the shell sets it: VECTOR_COLLECTION=<build> docker compose up -d backend
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-}
      # Phase 1 reads data/ and .env under this root (docs/ISSUES.md P2-07)
      KOSIS_WORKSPACE: /app
    volumes:
      # Provided data stays outside the image (security pledge)
      - ./data:/app/data:ro
      # KURE-v1 weights, downloaded on the first search and kept across restarts
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # slim image has no curl. /health does not load the search resources: healthy != searchable (503 until loaded)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    # Vector store (T2-44, was chromadb/chroma:1.5.9): PostgreSQL 17 with pgvector. The tables are created on first
    # use by kosis_rag.adapters.vectorstore (the comprehensive repo's alembic migration makes the same ones).
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kosis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosis}
      POSTGRES_DB: ${POSTGRES_DB:-kosis}
    volumes:
      # Named volume: embeddings are a rebuildable copy of data/tables.jsonl and never enter git
      - pg-data:/var/lib/postgresql/data
    ports:
      # Loopback only: the default password is for local development
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kosis} -d ${POSTGRES_DB:-kosis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    # Traces of eval runs (T2-15, evals/trace.py): UI http://localhost:16686, OTLP gRPC :4317.
    # Optional: docker compose --profile obs up -d jaeger, then OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
    # In-memory storage: traces are gone on restart; the run folder's report keeps the failure stages.
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["obs"]
    ports:
      - "16686:16686"
      - "4317:4317"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg-data:
  hf-cache:
