services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Inside compose the backend reaches Chroma by service name; .env holds the host-side address.
      # For the shared Chroma, set COMPOSE_CHROMA_HOST / COMPOSE_CHROMA_PORT in .env (compose reads it for ${...}).
      CHROMA_HOST: ${COMPOSE_CHROMA_HOST:-chroma}
      CHROMA_PORT: ${COMPOSE_CHROMA_PORT:-8000}
      # .env value unless the shell sets it: CHROMA_COLLECTION=<build> docker compose up -d backend
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-}
      # Phase 1 reads data/ and .env under this root (docs/ISSUES.md P2-07)
      KOSIS_WORKSPACE: /app
    volumes:
      # Provided data stays outside the image (security pledge)
      - ./data:/app/data:ro
      # KURE-v1 weights, downloaded on the first search and kept across restarts
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      # slim image has no curl. /health does not load the search resources: healthy != searchable (503 until loaded)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  chroma:
    # Pinned release (1.x Rust server: data in /data, API under /api/v2); client is chromadb-client of the same version
    image: chromadb/chroma:1.5.9
    environment:
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      # Named volume: embeddings are a rebuildable copy of data/tables.jsonl and never enter git
      - chroma-data:/data
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    healthcheck:
      # The image has bash but no curl/python, so ask the heartbeat endpoint over /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    # Traces of eval runs (T2-15, evals/trace.py): UI http://localhost:16686, OTLP gRPC :4317.
    # Optional: docker compose --profile obs up -d jaeger, then OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
    # In-memory storage: traces are gone on restart; the run folder's report keeps the failure stages.
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["obs"]
    ports:
      - "16686:16686"
      - "4317:4317"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma-data:
  hf-cache:
