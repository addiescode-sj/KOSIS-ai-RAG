[project]
name = "kosis-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Phase 1 runtime (vendor/phase1/requirements.txt)
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=2.3",
    "langchain-core>=1.7.0",
    "rank-bm25>=0.2.2",
    "chromadb-client==1.5.9",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "pytest>=8.0",
]
embed = [
    "sentence-transformers",
]

[tool.uv]
package = false
